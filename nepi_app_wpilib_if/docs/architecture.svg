<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="ah-built" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f4a"/>
    </marker>
    <marker id="ah-missing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4432f"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a72"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#fbfaf7"/>

  <!-- ===== Title ===== -->
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1d1d1b">NEPI &#8596; WPILib &#8596; RoboRIO Interface</text>
  <text x="30" y="56" font-size="12.5" fill="#6b6b66">Whiteboard architecture redrawn against the code &#183; nepi_app_wpilib_if @ e091d57 &#183; solid = implemented, dashed = not implemented</text>

  <!-- ===== Column headers ===== -->
  <text x="170" y="88" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="middle" letter-spacing="1.2">NEPI</text>
  <text x="515" y="88" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="middle" letter-spacing="1.2">APP &#183; nepi_app_wpilib_if</text>
  <text x="850" y="88" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="middle" letter-spacing="1.2">ROBO RIO</text>
  <text x="1100" y="88" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="middle" letter-spacing="1.2">JAVA VENDOR LIB</text>
  <line x1="30" y1="98" x2="1200" y2="98" stroke="#1d1d1b" stroke-width="1.4"/>

  <!-- column rules: NEPI | APP | ROBO RIO | JAVA -->
  <line x1="325" y1="98" x2="325" y2="790" stroke="#6f6c64" stroke-width="2.2"/>
  <line x1="705" y1="98" x2="705" y2="790" stroke="#6f6c64" stroke-width="2.2"/>
  <line x1="990" y1="98" x2="990" y2="790" stroke="#6f6c64" stroke-width="2.2"/>

  <!-- ================= SECTION A ================= -->
  <text x="30" y="124" font-size="11" font-weight="700" fill="#b4432f" letter-spacing="1.1">A &#183; NEPI PERCEPTION &amp; POSE OUT TO THE ROBOT &#8212; NOT IMPLEMENTED</text>
  <line x1="600" y1="120" x2="1200" y2="120" stroke="#e8c8c0" stroke-width="1"/>

  <!-- Row 1: Targets -->
  <rect x="40" y="146" width="260" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="170" y="170" font-size="12.5" fill="#1d1d1b" text-anchor="middle">Targets App</text>
  <rect x="350" y="146" width="230" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="465" y="164" font-size="12.5" font-weight="600" fill="#1d1d1b" text-anchor="middle">TARGET</text>
  <text x="465" y="178" font-size="10" fill="#6b6b66" text-anchor="middle">ConnectProcessIFTargets</text>
  <line x1="300" y1="165" x2="344" y2="165" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <line x1="580" y1="165" x2="686" y2="165" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <rect x="686" y="155" width="38" height="20" rx="10" fill="#fbfaf7" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="705" y="169" font-size="10.5" font-weight="700" fill="#b4432f" text-anchor="middle">NT</text>
  <line x1="724" y1="165" x2="994" y2="165" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <text x="858" y="160" font-size="10" fill="#b4432f" text-anchor="middle">no key group defined</text>
  <rect x="1000" y="146" width="200" height="38" rx="4" fill="#fff" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="1100" y="163" font-size="10.5" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">nepi_targets.json</text>
  <text x="1100" y="177" font-size="10" fill="#b4432f" text-anchor="middle">0 bytes</text>

  <!-- Row 2: Obstacles -->
  <rect x="40" y="206" width="260" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="170" y="230" font-size="12.5" fill="#1d1d1b" text-anchor="middle">Obstacles App</text>
  <rect x="350" y="206" width="230" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="465" y="224" font-size="12.5" font-weight="600" fill="#1d1d1b" text-anchor="middle">OBS</text>
  <text x="465" y="238" font-size="10" fill="#6b6b66" text-anchor="middle">ConnectObstaclesIF</text>
  <line x1="300" y1="225" x2="344" y2="225" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <line x1="580" y1="225" x2="686" y2="225" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <rect x="686" y="215" width="38" height="20" rx="10" fill="#fbfaf7" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="705" y="229" font-size="10.5" font-weight="700" fill="#b4432f" text-anchor="middle">NT</text>
  <line x1="724" y1="225" x2="994" y2="225" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <rect x="1000" y="206" width="200" height="38" rx="4" fill="#fff" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="1100" y="223" font-size="10.5" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">nepi_obsticals.json</text>
  <text x="1100" y="237" font-size="10" fill="#b4432f" text-anchor="middle">0 bytes</text>

  <!-- Row 3: NavPose out -->
  <rect x="40" y="266" width="260" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.6"/>
  <text x="170" y="290" font-size="12.5" font-weight="600" fill="#1d1d1b" text-anchor="middle">NP MGR &#183; NavPose Mgr</text>
  <rect x="350" y="266" width="230" height="38" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="465" y="284" font-size="12.5" font-weight="600" fill="#1d1d1b" text-anchor="middle">NAVPOSE</text>
  <text x="465" y="298" font-size="10" fill="#6b6b66" text-anchor="middle">ConnectNavPoseIF</text>
  <line x1="300" y1="285" x2="344" y2="285" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <line x1="580" y1="285" x2="686" y2="285" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <rect x="686" y="275" width="38" height="20" rx="10" fill="#fbfaf7" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="705" y="289" font-size="10.5" font-weight="700" fill="#b4432f" text-anchor="middle">NT</text>
  <line x1="724" y1="285" x2="994" y2="285" stroke="#b4432f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <rect x="1000" y="266" width="200" height="38" rx="4" fill="#fff" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="1100" y="283" font-size="10.5" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">nepi_navpose.json</text>
  <text x="1100" y="297" font-size="10" fill="#b4432f" text-anchor="middle">0 bytes</text>

  <!-- section A footnote -->
  <text x="350" y="326" font-size="10.5" fill="#b4432f">All three dicts are stored and logged once &#8212; no reader, no NT writer.</text>

  <!-- ================= SECTION B ================= -->
  <line x1="30" y1="348" x2="1200" y2="348" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="30" y="372" font-size="11" font-weight="700" fill="#1f6f4a" letter-spacing="1.1">B &#183; ROBOT TELEMETRY IN, RBX DEVICE OUT &#8212; IMPLEMENTED</text>
  <line x1="520" y1="368" x2="1200" y2="368" stroke="#bcd8c9" stroke-width="1"/>

  <!-- RBX CONFIG group -->
  <rect x="350" y="392" width="230" height="86" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="465" y="410" font-size="12" font-weight="700" fill="#1d1d1b" text-anchor="middle">RBX CONFIG</text>
  <text x="362" y="430" font-size="11" fill="#1d1d1b"># motors &#183; slot map</text>
  <text x="362" y="444" font-size="9.5" fill="#c06a25">ROS params, operator-set</text>
  <text x="362" y="462" font-size="11" fill="#1d1d1b">motor feedback</text>
  <text x="362" y="474" font-size="9.5" fill="#6b6b66">&#8594; MotorsStatus</text>

  <!-- discovered ids: advisory only -->
  <line x1="700" y1="430" x2="590" y2="430" stroke="#c06a25" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-muted)"/>
  <text x="712" y="426" font-size="10" fill="#c06a25">discovered motor_ids</text>
  <text x="712" y="439" font-size="10" fill="#c06a25">&#8212; read-only advisory</text>

  <!-- motor feedback in -->
  <rect x="720" y="452" width="260" height="34" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="467" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/Motors/&lt;id&gt;</text>
  <text x="850" y="480" font-size="9.5" fill="#6b6b66" text-anchor="middle">Motor-Control Feedback</text>
  <line x1="716" y1="469" x2="586" y2="469" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <!-- NAVPOSE DATA in -->
  <rect x="720" y="510" width="260" height="46" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="527" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/Position &#183; Velocity</text>
  <text x="850" y="540" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/Orientation</text>
  <text x="850" y="552" font-size="9.5" fill="#6b6b66" text-anchor="middle">read at 10 Hz</text>
  <rect x="686" y="523" width="38" height="20" rx="10" fill="#fbfaf7" stroke="#1f6f4a" stroke-width="1.3"/>
  <text x="705" y="537" font-size="10.5" font-weight="700" fill="#1f6f4a" text-anchor="middle">NT</text>
  <line x1="686" y1="533" x2="586" y2="533" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <rect x="350" y="510" width="230" height="46" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="465" y="528" font-size="12.5" font-weight="600" fill="#1d1d1b" text-anchor="middle">NAVPOSE DATA</text>
  <text x="465" y="543" font-size="10" fill="#6b6b66" text-anchor="middle">fused &#8594; get_navpose_dict()</text>

  <!-- getNavPoseCb -->
  <line x1="465" y1="556" x2="465" y2="580" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <text x="478" y="574" font-size="11" font-weight="600" fill="#1f6f4a" font-family="ui-monospace, Menlo, monospace">getNavPoseCb</text>

  <!-- RBX DRIVER -->
  <rect x="350" y="586" width="230" height="60" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
  <text x="465" y="606" font-size="12.5" font-weight="700" fill="#1d1d1b" text-anchor="middle">RBX DRIVER</text>
  <text x="465" y="621" font-size="10" fill="#6b6b66" text-anchor="middle">WpilibRbxIF &#8594; RBXRobotIF</text>
  <text x="465" y="635" font-size="9.5" fill="#c06a25" text-anchor="middle">hosted in the app, not a driver pkg</text>

  <!-- DEVICE RBX -->
  <rect x="40" y="586" width="260" height="60" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="2"/>
  <text x="170" y="606" font-size="12.5" font-weight="700" fill="#1d1d1b" text-anchor="middle">DEVICE RBX</text>
  <text x="170" y="621" font-size="10" fill="#6b6b66" text-anchor="middle">commandable RBX device</text>
  <text x="170" y="635" font-size="9.5" fill="#6b6b66" text-anchor="middle">consumed by nepi_app_auto_move</text>
  <line x1="346" y1="616" x2="304" y2="616" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <!-- DEVICE RBX -> NP MGR return path -->
  <path d="M 40 630 L 16 630 L 16 296 L 36 296" fill="none" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <text x="26" y="466" font-size="10" fill="#1f6f4a" transform="rotate(-90 26 466)" text-anchor="middle">npx/navpose &#8594; NP MGR</text>

  <!-- RBX feedback / capabilities -->
  <rect x="720" y="586" width="260" height="34" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="601" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/RBX/Feedback</text>
  <text x="850" y="614" font-size="9.5" fill="#6b6b66" text-anchor="middle">supported_capabilities, max speeds</text>
  <line x1="716" y1="603" x2="586" y2="603" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <!-- RBX command out -->
  <rect x="720" y="646" width="260" height="34" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="661" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/RBX/Command</text>
  <text x="850" y="674" font-size="9.5" fill="#6b6b66" text-anchor="middle">CHASSIS_SPEEDS &#183; TARGET_POSE &#183; STOP</text>
  <line x1="586" y1="663" x2="716" y2="663" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <!-- motor command out -->
  <rect x="720" y="690" width="260" height="30" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="709" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/MotorCommand/&lt;id&gt;</text>
  <line x1="586" y1="705" x2="716" y2="705" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>

  <!-- heartbeat -->
  <rect x="720" y="730" width="260" height="30" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="850" y="749" font-size="11" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/NEPI/System/heartbeat</text>
  <line x1="586" y1="745" x2="716" y2="745" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <line x1="716" y1="752" x2="586" y2="752" stroke="#1f6f4a" stroke-width="1.6" marker-end="url(#ah-built)"/>
  <text x="465" y="749" font-size="10.5" fill="#6b6b66" text-anchor="middle">1 Hz &#183; RIO answers False</text>

  <!-- APP: one NT client note -->
  <text x="465" y="697" font-size="10" fill="#1f6f4a" text-anchor="middle">the only ntcore client in the tree</text>

  <!-- Java lane section B -->
  <rect x="1000" y="586" width="200" height="38" rx="4" fill="#fff" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="1100" y="603" font-size="10.5" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">nepi_motors.json</text>
  <text x="1100" y="617" font-size="10" fill="#b4432f" text-anchor="middle">0 bytes</text>
  <rect x="1000" y="632" width="200" height="38" rx="4" fill="#fff" stroke="#b4432f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="1100" y="649" font-size="10.5" fill="#1d1d1b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">nepi_detections.json</text>
  <text x="1100" y="663" font-size="10" fill="#b4432f" text-anchor="middle">0 bytes</text>
  <text x="1100" y="697" font-size="10" fill="#b4432f" text-anchor="middle">no .java in repo</text>

  <!-- ===== Legend ===== -->
  <line x1="30" y1="806" x2="1200" y2="806" stroke="#d8d6cf" stroke-width="1"/>
  <line x1="40" y1="832" x2="80" y2="832" stroke="#1f6f4a" stroke-width="1.8" marker-end="url(#ah-built)"/>
  <text x="90" y="836" font-size="11.5" fill="#1d1d1b">implemented</text>
  <line x1="200" y1="832" x2="240" y2="832" stroke="#b4432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-missing)"/>
  <text x="250" y="836" font-size="11.5" fill="#1d1d1b">on the board, not in the code</text>
  <line x1="450" y1="832" x2="490" y2="832" stroke="#c06a25" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-muted)"/>
  <text x="500" y="836" font-size="11.5" fill="#1d1d1b">built, but different from the board</text>
  <text x="760" y="836" font-size="11" fill="#6b6b66">Heartbeat, RBX Command, Motor Command: in the code, not on the board.</text>
  <text x="40" y="858" font-size="10.5" fill="#6b6b66">Uncertain on the original: two Java box labels, the &#8220;HELD F-R&#8221; box, the second RBX CONFIG field, and whether the # MOTORS arrow was meant as bidirectional.</text>

</svg>
